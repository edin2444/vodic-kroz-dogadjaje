<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" lang="sr" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="bootstrap_5.3.8/css/bootstrap.min.css">
    <title>Početna Strana</title>
</head>
<body id="strana" onload="PrikaziDogađaje()">
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="img/bakson_ltd_logo.jpeg" alt="Logo Firme" width="50" height="50"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Početna</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">O nama</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Kontakt</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="row">
  <div class="col">
    <h1 class="center anim1">Vodič kroz događaje</h1>
    <h5 class="center anim1">Na ovoj stranici ćete pronaći sve informacije o događajima koji se organizuju u raznim delovima grada. Pogledajte listu i pridružite nam se!</h5>
  </div>
</div>
<div class="row">
  <div class="col-sm-12">
    <h2 class="center anim1">Naši događaji</h2>
  </div>
  <div class="accordion anim1" id="btn1">
    <div class="accordion-item" style="margin-left: 30px; margin-right: 30px;">
      <h2 class="accordion-header" id="headingOne">
        <button class="accordion-button btn btn-warning d-block text-center" type="button" data-bs-toggle="collapse" data-bs-target="#filter" aria-expanded="false" aria-controls="filter">
          Filter
        </button>
      </h2>
      <div id="filter" class="accordion-collapse collapse" data-bs-parent="#btn1">
        <div class="accordion-body checks">
          <label><input type="radio" id="svi" name="filter" value="svi" style="cursor: pointer;" onchange="Filter()" checked>&nbsp;Svi događaji</label><br>
          <label><input type="radio" id="koncert" name="filter" value="koncert" style="cursor: pointer;" onchange="Filter()">&nbsp;Koncerti</label><br>
          <label><input type="radio" id="predavanje" name="filter" value="predavanje" style="cursor: pointer;" onchange="Filter()">&nbsp;Predavanja</label><br>
          <label><input type="radio" id="radionica" name="filter" value="radionica" style="cursor: pointer;" onchange="Filter()">&nbsp;Radionice</label><br>
          <label for="tekst">Pretraga po nazivu</label><input type="text" id="tekst" placeholder="Unesite naziv događaja ili deo naziva..." style="margin-top: 10px;" oninput="FilterTeksta()">
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-12">
    <h5 class="center anim1 filtertext">Izabrani filter će ovde biti prikazan</h5>
  </div>
  <div class="row g-4"style="margin-left: 10px; margin-right: 10px;" id="događaji">
    <div class="col-sm-12 col-lg-4 Konc" id="1">
      <!-- Ovde ide struktura kartice -->
    </div>
    <div class="col-sm-12 col-lg-4 Pred" id="2">
      <!-- Ovde ide struktura kartice -->
    </div>
    <div class="col-sm-12 col-lg-4 Rad" id="3">
      <!-- Ovde ide struktura kartice -->
    </div>
    <div class="col-sm-12 col-lg-4 Pred" id="4">
      <!-- Ovde ide struktura kartice -->
    </div>
    <div class="col-sm-12 col-lg-4 Konc" id="5">
      <!-- Ovde ide struktura kartice -->
    </div>
    <div class="col-sm-12 col-lg-4 Rad" id="6">
      <!-- Ovde ide struktura kartice -->
    </div>
  </div>
</body>
<script defer src="js/script.js"></script>
<script src="bootstrap_5.3.8/js/bootstrap.min.js"></script>
</html>
